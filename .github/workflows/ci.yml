name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Do not run workflows that receive secrets on fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      WELLGROUND_DUCKDB_PATH: data/release/forge.duckdb
      WELLGROUND_CHROMA_PATH: data/release/chroma
      WELLGROUND_BM25_PATH: data/release/bm25
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run tests
        run: uv run pytest tests/ -rA
